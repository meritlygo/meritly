workflows:
  ios-testflight:
    name: Meritly iOS — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Capacitor CLI 8.6.2 требует node >= 22.0.0. "latest" может дать 25.x —
      # берём LTS-ветку, чтобы сборка не сломалась от смены мажорной версии.
      node: 22.14.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.github.meritlygo
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Проверка исходника и окружения
        script: |
          set -e
          echo "repo: $(pwd)"
          ls -la Meritly.html
          node --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Установка зависимостей оболочки
        script: |
          set -e
          cd app
          npm install --no-audit --no-fund

      - name: Сборка www из Meritly.html
        script: |
          set -e
          cd app
          npm run www
          ls -la www
          # Проверяем, что в сборке именно игра, а не пустая страница
          node -e "const s=require('fs').readFileSync('www/index.html','utf8'); if(s.length<500000){throw new Error('www подозрительно мал')}; if(!s.includes('Meritly')){throw new Error('в www не Meritly')}; console.log('www ok, '+s.length+' символов')"

      - name: Добавление платформы iOS и синхронизация
        script: |
          set -e
          cd app
          npx cap add ios
          npx cap sync ios

      - name: Правка Info.plist (разрешения и шифрование)
        script: |
          set -e
          cd app
          PLIST=ios/App/App/Info.plist
          set_key () {
            KEY="$1"; VAL="$2"
            if /usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :$KEY $VAL" "$PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :$KEY string $VAL" "$PLIST"
            fi
          }
          set_key NSLocationWhenInUseUsageDescription "Ваш район, чтобы показать людей Meritly рядом. Точное место не показывается и не сохраняется."
          set_key NSPhotoLibraryUsageDescription "Фото для аватарки и фона доски. На сервер не загружается: остаётся на вашем телефоне. Попадает в картинку, только если вы сами нажмёте «Поделиться»."
          # Только iPhone: иначе Apple требует скриншоты iPad и вёрстку под него
          /usr/libexec/PlistBuddy -c "Delete :UIDeviceFamily" "$PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 1" "$PLIST"
          # Только стандартный HTTPS — шифрование не подпадает под исключения
          if /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          fi
          plutil -lint "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST"

      - name: Иконка приложения (1024x1024, без прозрачности)
        script: |
          set -e
          cd app
          SET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          test -d "$SET" || { echo "ОТКАЗ: нет $SET"; exit 1; }
          # Capacitor кладёт туда файл 1024x1024 под именем AppIcon-512@2x.png;
          # эту же запись использует и одиночная иконка Xcode 26.
          cp ios-assets/AppIcon-1024.png "$SET/AppIcon-512@2x.png"
          ls -la "$SET"
          cat "$SET/Contents.json"
          # Проверка без сторонних библиотек: на раннере нет PIL, а sips есть всегда.
          # sips печатает "pixelWidth"/"pixelHeight"; hasAlpha=no — требование App Store.
          sips -g pixelWidth -g pixelHeight -g hasAlpha -g format "$SET/AppIcon-512@2x.png"
          W=$(sips -g pixelWidth  "$SET/AppIcon-512@2x.png" | awk '/pixelWidth/{print $2}')
          H=$(sips -g pixelHeight "$SET/AppIcon-512@2x.png" | awk '/pixelHeight/{print $2}')
          A=$(sips -g hasAlpha    "$SET/AppIcon-512@2x.png" | awk '/hasAlpha/{print $2}')
          echo "иконка: ${W}x${H}, alpha=${A}"
          test "$W" = "1024" && test "$H" = "1024" || { echo "ОТКАЗ: иконка не 1024x1024"; exit 1; }
          test "$A" = "no" || { echo "ОТКАЗ: у иконки есть прозрачность"; exit 1; }

      - name: Подпись и сборка .ipa
        script: |
          set -e
          cd "$CM_BUILD_DIR/app"
          xcode-project use-profiles
          # build-ipa сам делает archive + export. Отдельный xcodebuild archive здесь
          # НЕ нужен: он бы собрал проект дважды и сжёг 2-4 минуты из 500 бесплатных.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
          ls -la build/ios/ipa/

    artifacts:
      - app/build/ios/ipa/*.ipa
      - app/build/**/*.xcarchive
      - app/www/index.html
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        expire_build_submission_when: 90d
        # Автоматический выпуск для внешних тестеров не включаем:
        # сначала проверяем на своём iPhone, потом решаем.
        submit_to_app_store: false